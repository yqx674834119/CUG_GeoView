apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geoview.appName" . }}
  labels:
    {{- include "geoview.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "geoview.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "geoview.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: init-app-data
          image: "{{ default .Values.mysql.image.repository .Values.app.init.image.repository }}:{{ default .Values.mysql.image.tag .Values.app.init.image.tag }}"
          imagePullPolicy: {{ default .Values.mysql.image.pullPolicy .Values.app.init.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              mkdir -p
              /mnt/app-data/static
              /mnt/app-data/offline_cache/huggingface
              /mnt/app-data/offline_cache/torch
              /mnt/app-data/offline_cache/paddle
          volumeMounts:
            - name: app-data
              mountPath: /mnt/app-data
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: frontend
              containerPort: {{ .Values.app.config.port.frontend }}
            - name: backend
              containerPort: {{ .Values.app.config.port.backend }}
            - name: miner-front
              containerPort: {{ .Values.app.config.miner.frontendPort }}
            - name: miner-back
              containerPort: {{ .Values.app.config.miner.backendPort }}
          env:
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: MYSQL_HOST
              value: {{ include "geoview.mysqlHost" . | quote }}
            - name: MYSQL_PORT
              value: {{ ternary (.Values.mysql.service.port | toString) (.Values.externalMySQL.port | toString) .Values.mysql.enabled | quote }}
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "geoview.fullname" . }}-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geoview.fullname" . }}-secret
                  key: mysql-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "geoview.fullname" . }}-secret
                  key: mysql-database
            - name: FLASK_CONFIG
              value: production
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_CACHE
              value: /root/.cache/huggingface/hub
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TORCH_HOME
              value: /root/.cache/torch
            - name: PADDLE_HOME
              value: /root/.paddle
            - name: GEOVIEW_MODEL_ROOT
              value: /app/backend/model
            {{- range .Values.app.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: app-data
              mountPath: /app/backend/static
              subPath: static
            - name: app-data
              mountPath: /root/.cache/huggingface
              subPath: offline_cache/huggingface
            - name: app-data
              mountPath: /root/.cache/torch
              subPath: offline_cache/torch
            - name: app-data
              mountPath: /root/.paddle
              subPath: offline_cache/paddle
            - name: app-data
              mountPath: /root/.cache/paddle
              subPath: offline_cache/paddle
          resources:
            requests:
              cpu: {{ .Values.app.resources.requests.cpu | quote }}
              memory: {{ .Values.app.resources.requests.memory | quote }}
              {{- if .Values.app.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.app.gpu.count | quote }}
              {{- end }}
            limits:
              cpu: {{ .Values.app.resources.limits.cpu | quote }}
              memory: {{ .Values.app.resources.limits.memory | quote }}
              {{- if .Values.app.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.app.gpu.count | quote }}
              {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "geoview.fullname" . }}-config
        - name: app-data
          {{- if .Values.app.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "geoview.appName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
