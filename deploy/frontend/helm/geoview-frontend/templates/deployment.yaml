apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geoview-frontend.fullname" . }}
  labels:
    {{- include "geoview-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "geoview-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geoview-frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: GEOVIEW_BACKEND_URL
              value: {{ .Values.frontend.runtimeConfig.backendUrl | quote }}
            - name: GEOVIEW_BACKEND_PROTOCOL
              value: {{ .Values.frontend.runtimeConfig.backendProtocol | quote }}
            - name: GEOVIEW_BACKEND_HOST
              value: {{ .Values.frontend.runtimeConfig.backendHost | quote }}
            - name: GEOVIEW_BACKEND_PORT
              value: {{ .Values.frontend.runtimeConfig.backendPort | quote }}
            - name: GEOVIEW_BACKEND_ASSET_MODE
              value: {{ .Values.frontend.runtimeConfig.backendAssetMode | quote }}
            - name: GEOVIEW_FRONTEND_ASSET_DEBUG
              value: {{ .Values.frontend.runtimeConfig.frontendAssetDebug | quote }}
            - name: GEOVIEW_FRONTEND_DEBUG
              value: {{ .Values.frontend.runtimeConfig.frontendDebug | quote }}
            - name: GEOVIEW_FRONTEND_VERSION_TAG
              value: {{ .Values.frontend.runtimeConfig.frontendVersionTag | quote }}
            - name: GEOVIEW_MINER_ENABLED
              value: {{ .Values.frontend.runtimeConfig.minerEnabled | quote }}
            - name: GEOVIEW_MINER_URL
              value: {{ .Values.frontend.runtimeConfig.minerUrl | quote }}
            - name: GEOVIEW_BAIDU_MAP_ACCESS_KEY
              value: {{ .Values.frontend.runtimeConfig.baiduMapAccessKey | quote }}
          {{- if .Values.frontend.persistence.enabled }}
          volumeMounts:
            - name: frontend-data
              mountPath: {{ .Values.frontend.persistence.mountPath | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- if .Values.frontend.persistence.enabled }}
      volumes:
        - name: frontend-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "geoview-frontend.fullname" .)) .Values.frontend.persistence.existingClaim }}
      {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
