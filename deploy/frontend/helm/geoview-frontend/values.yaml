nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: 172.20.20.243:8443/your-project/geoview-frontend
    tag: latest
    pullPolicy: IfNotPresent
  runtimeConfig:
    backendUrl: ""
    backendProtocol: http
    backendHost: ""
    backendPort: "5008"
    minerEnabled: false
    minerUrl: ""
    baiduMapAccessKey: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  service:
    type: ClusterIP
    port: 3000
    targetPort: 80
    nodePort: null
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: geoview-frontend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
