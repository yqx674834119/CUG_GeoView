version: "3.9"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-geoview-frontend:latest}
    container_name: geoview-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      GEOVIEW_BACKEND_URL: ${GEOVIEW_BACKEND_URL:-}
      GEOVIEW_BACKEND_PROTOCOL: ${GEOVIEW_BACKEND_PROTOCOL:-http}
      GEOVIEW_BACKEND_HOST: ${GEOVIEW_BACKEND_HOST:-}
      GEOVIEW_BACKEND_PORT: ${GEOVIEW_BACKEND_PORT:-5008}
      GEOVIEW_BACKEND_ASSET_MODE: ${GEOVIEW_BACKEND_ASSET_MODE:-buffered}
      GEOVIEW_FRONTEND_ASSET_DEBUG: ${GEOVIEW_FRONTEND_ASSET_DEBUG:-true}
      GEOVIEW_FRONTEND_DEBUG: ${GEOVIEW_FRONTEND_DEBUG:-true}
      GEOVIEW_MINER_ENABLED: ${GEOVIEW_MINER_ENABLED:-false}
      GEOVIEW_MINER_URL: ${GEOVIEW_MINER_URL:-}
      GEOVIEW_BAIDU_MAP_ACCESS_KEY: ${GEOVIEW_BAIDU_MAP_ACCESS_KEY:-}
    restart: unless-stopped
