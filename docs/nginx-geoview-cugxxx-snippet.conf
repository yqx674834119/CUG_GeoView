        # GeoView alias proxy.
        # Public URL: http://livablecitylab.hkust-gz.edu.cn/CUGxxx/Geoview/
        # Upstream: http://10.30.58.75:59273/
        #
        # Put this inside the existing server { ... } block on the public Nginx.
        location = /CUGxxx/Geoview {
            return 301 /CUGxxx/Geoview/;
        }

        location = /CUGxxx/Geoview/runtime-config.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            return 200 'window.__GEOVIEW_RUNTIME_CONFIG__ = {
  backendUrl: "http://livablecitylab.hkust-gz.edu.cn/CUGxxx/Geoview",
  backendProtocol: "http",
  backendHost: "",
  backendPort: "",
  backendAssetMode: "sendfile",
  frontendAssetDebug: "false",
  frontendDebug: "false",
  minerEnabled: "false",
  minerUrl: "",
  baiduMapAccessKey: ""
};';
        }

        location /CUGxxx/Geoview/ {
            proxy_pass http://10.30.58.75:59273/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            client_max_body_size 2000M;
            proxy_connect_timeout 300;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
            proxy_redirect off;
        }
