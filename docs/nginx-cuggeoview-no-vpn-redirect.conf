# No-VPN GeoView redirect.
# Put this inside the existing server { ... } block for
# livablecitylab.hkust-gz.edu.cn on the public Nginx server.
#
# Public URL:
#   https://livablecitylab.hkust-gz.edu.cn/CUGGeoView/
#
# Target:
#   https://livablecitylab.hkust-gz.edu.cn/GeoView/

location ~ ^/CUGGeoView(?:/(.*))?$ {
    return 302 /GeoView/$1$is_args$args;
}
