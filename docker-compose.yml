version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cugrs:local-build
    container_name: cugrs-app
    ports:
      - "5008:5008"
      - "3000:3000"
      - "4000:4000"
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: paddle_rs
      MYSQL_PASSWORD: "Yqx090315."
      MYSQL_DATABASE: paddle_rs
      FLASK_CONFIG: production
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    depends_on:
      - mysql
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./backend/static:/app/backend/static
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - ./miner:/app/miner
      - /app/miner/node_modules
      # HuggingFace & other models cache (persists across container restarts and supports offline deployment)
      - ./offline_cache/huggingface:/root/.cache/huggingface
      - ./offline_cache/torch:/root/.cache/torch
      - ./offline_cache/paddle:/root/.paddle

    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  mysql:
    image: registry.openanolis.cn/openanolis/mysql:8.0.30-8.6
    container_name: cugrs-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: paddle_rs
      MYSQL_USER: paddle_rs
      MYSQL_PASSWORD: "Yqx090315."
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

volumes:
  mysql-data:
